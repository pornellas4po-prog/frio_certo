/* o contato manda a mensagem, a intenção é classificada e o agente certo responde (ou sugere a resposta ao humano) */
async function simulate(c, text, {skipLead=false}={}){
  if (!c) return; if (c._busy) return toast('Aguarde a resposta anterior', '', 'info');
  c._busy = true;
  try {
    if (c.status==='resolvida' || c.status==='aguardando') c.status = 'aberta';
    if (!skipLead){ markRead(c); pushMsg(c, {de:'lead', texto:text}); }
    const cls = classify(text, c); cls.text = text;
    await sleep(700);
    if (c.agente === 'humano'){
      pushMsg(c, {de:'sistema', tipo:'intent', texto:`Intenção: ${cls.label} · ${cls.conf}% · atendimento humano ativo (${c.humano.split(' ')[0]})`});
      const r = genReply(cls.intent==='humano' ? {sub:'geral'} : cls, c); const sug = r.out.find(o => o.texto);
      if (sug && isViewing(c) && $('#suggest')){ $('#suggest').innerHTML = `<div class="suggest"><div class="h">${ic('sparkles','xs')} Resposta sugerida pelo ${AGENTS[cls.intent==='humano'?'comercial':cls.intent].nome}</div><div style="white-space:pre-wrap;max-height:120px;overflow:auto">${esc(sug.texto)}</div>${sug.fonte?`<div class="xsmall muted mt8">${ic('book','xs')} Fonte: ${esc(sug.fonte)}</div>`:''}<div class="row mt8"><button class="btn xs pri" data-a="useSug">Usar sugestão</button><button class="btn xs ghost" data-a="dropSug">Descartar</button></div></div>`; S.sug = sug.texto; }
      return;
    }
    if (cls.intent === 'humano' || cls.sub === 'colab'){
      const x = ctxOf(c); const eq = c.agente==='financeiro' || cls.sub==='boleto' ? 'Financeiro' : c.agente==='tecnico' ? 'Técnico' : 'Atendimento';
      const tb = db.transbordo.find(t => t.nome.startsWith(eq)) || db.transbordo[0]; const at = tb.atendentes.find(a => a.online) || tb.atendentes[0];
      pushMsg(c, {de:'sistema', tipo:'intent', texto:`Intenção: ${cls.label} · ${cls.conf}% · transbordo para ${tb.nome}`});
      await agentSay(c, c.agente, {texto:`Claro${x.hi}! Vou te transferir para a equipe de ${tb.nome}. Em instantes, ${at.nome.split(' ')[0]} continua o atendimento por aqui.`});
      c.agente = 'humano'; c.humano = at.nome;
      pushMsg(c, {de:'sistema', tipo:'hum', texto:`Transferida para ${tb.nome} · ${at.nome} foi avisado(a) no WhatsApp`});
      addActivity({t:'Conversa transferida para humano', d:`${c.contato.nome} → ${tb.nome} (${at.nome})`, i:'transfer', c:'vio'});
      refreshChatChrome(c); return;
    }
    const prevAg = c.agente;
    pushMsg(c, {de:'sistema', tipo:'intent', texto:`Intenção: ${cls.label} · ${cls.conf}% · ${prevAg===cls.intent?'mantido com':'roteado para'} ${AGENTS[cls.intent].nome}`});
    c.agente = cls.intent; if (prevAg !== c.agente) refreshChatChrome(c);
    const r = genReply(cls, c);
    for (const o of r.out){
      if (o.late){ typingOn(c, c.agente); await sleep(1500); r.after && r.after(); r.after = null; r.sys.forEach(s => pushMsg(c, {de:'sistema', ...s})); r.sys = []; }
      await agentSay(c, c.agente, {tipo:o.tipo||'text', texto:o.texto, fonte:o.fonte, pix:o.pix, file:o.file, seed:o.seed, btns:o.btns, ...(o.fileFn ? {file:o.fileFn()} : {})});
    }
    if (r.after) r.after();
    r.sys.forEach(s => pushMsg(c, {de:'sistema', ...s}));
    refreshChatChrome(c);
  } finally { typingOff(c); c._busy = false; saveDB(); }
}

function simInboxBtn(){ const b = $('#simInboxBtn'); if (!b) return; b.disabled = !!S.inboxRun; b.innerHTML = S.inboxRun ? '<span class="spin" style="width:12px;height:12px"></span> Recebendo mensagens…' : `${ic('flask','xs')} Simular mensagens recebidas`; }
function newContact(ct){
  const ex = db.conversas.find(c => c.contato.nome===ct.nome); if (ex) return ex;
  const c = {id:uid('cv'), canal:ct.canal, contato:{nome:ct.nome, telefone:ct.telefone}, clienteId:'', agente:'comercial', humano:'', status:'aberta', unread:0, msgs:[]};

A.simInbox = async () => {
  if (S.inboxRun) return;
  const open = S.route.name==='atendimento' ? S.route.id : '';
  const picks = INBOX_DEMO.filter(x => x[0]==='new' ? !db.conversas.some(c => c.contato.nome===x[1].nome) : (byId(db.conversas, x[0]) && x[0]!==open && !byId(db.conversas, x[0])._busy)).slice(0, 7);
  if (!picks.length) return toast('As mensagens de demonstração já foram enviadas', 'Use "Recomeçar com dados de exemplo" no menu do usuário para repetir.', 'info');
  S.inboxRun = true; simInboxBtn();
  try {
    for (let i=0; i<picks.length; i++){
      await sleep(i ? 1500 + Math.random()*700 : 600);
      const p = picks[i]; const c = p[0]==='new' ? newContact(p[1]) : byId(db.conversas, p[0]); const txt = p[0]==='new' ? p[2] : p[1];
      if (c && !c._busy) simulate(c, txt);
    }
  } finally { S.inboxRun = false; simInboxBtn(); }
};

/* ---- contexto do contato e classificação da intenção ---- */
function ctxOf(c){
  const cli = c.clienteId ? byId(db.clientes, c.clienteId) : null;
  const eqs = cli ? db.equipamentos.filter(e => e.clienteId===cli.id) : [];
  const RK = {'Em andamento':0, 'Agendada':1, 'Pendente':2, 'Concluída':3, 'Cancelada':4};
  const oss = cli ? db.os.filter(o => o.clienteId===cli.id).sort((a,b) => RK[a.status]-RK[b.status] || (a.status==='Concluída' ? (b.data||'').localeCompare(a.data||'') : ((a.data||'9')+a.hora).localeCompare((b.data||'9')+b.hora))) : [];
  const prox = oss.filter(o => ['Em andamento','Agendada'].includes(o.status)).sort((a,b) => (a.data+a.hora).localeCompare(b.data+b.hora))[0] || null;
  const abertos = cli ? titulos().filter(t => t.clienteId===cli.id && t.situacao!=='Pago').sort((a,b) => a.venc.localeCompare(b.venc)) : [];
  const first = cli && cli.tipo==='PJ' ? '' : c.contato.nome.startsWith('@') ? '' : c.contato.nome.split(/\s+/)[0];
  return {cli, eqs, oss, prox, abertos, first, hi: first ? `, ${first}` : ''};
}
function classify(text, c){
  const n = normalize(text); const has = (...w) => w.some(x => n.includes(x));
  const r = (intent, sub, label, conf) => ({intent, sub, label, conf: conf + Math.floor(Math.random()*4)});
  if (has('atendente','humano','falar com','uma pessoa','reclama','insatisfeit','gerente','dono')) return r('humano','humano','Falar com uma pessoa',95);
  if (has('ja paguei','paguei','fiz o pix','pagamento feito','transferi','comprovante de pagamento')) return r('financeiro','pago','Financeiro · Confirmação de pagamento',93);
  if (has('boleto','2a via','segunda via','pix','pagar','cobranca','fatura','chave')) return r('financeiro','boleto','Financeiro · Pix e boleto',94);
  if (has('relatorio','laudo','nota fiscal','pmoc','comprovante do servico')) return r('tecnico','relatorio','Técnico · Relatório do serviço',92);
  if (has('aprovar','aprovado','aprovo','vamos fechar','pode fechar','fechado','aceito','pode fazer')) return r('comercial','aprovar','Comercial · Aprovação de orçamento',92);
  if (has('que horas','horario','chega','chegando','a caminho','vem hoje','vem amanha','quando vem','esta confirmado','confirmado')) return r('tecnico','status','Técnico · Status da visita',94);
  if (has('nao gela','nao esta gelando','gelando pouco','esquenta','pinga','pingando','vazando','agua','barulho','nao liga','desliga sozinho','desarma','erro','piscando','cheiro','fedendo','quebrou','parou')) return r('tecnico','defeito','Técnico · Defeito no aparelho',95);
  if (has('quanto custa','orcamento','preco','valor','instalar','instalacao','comprar','btu','mil btus')) return r('comercial','orcamento','Comercial · Orçamento',95);
  if (has('limpeza','higieniza','preventiva','manutencao','agendar','marcar','revisao','limpar')) return r('tecnico','agendar','Técnico · Agendar preventiva',95);
  if (n.length < 70 && has('obrigad','valeu','ok','beleza','combinado','perfeito','vou passar','vou pagar','fico aguardando')) return r(c.agente!=='humano' ? c.agente : 'comercial','obrigado','Agradecimento · confirmação',90);
  return r('comercial','geral','Comercial · Dúvida geral',76);
}

/* ================= CADASTROS GENÉRICOS =================
   Um único motor de CRUD (tabela com busca, filtros e paginação + formulário em modal + exclusão com confirmação)
   atende as telas de cadastro simples do sistema. Cada tela é descrita por um "schema". */
const CRUD = {};
const PAGE = 10;
function crudRoute(sc){
  CRUD[sc.key] = sc;
  ROUTES[sc.key] = {title:sc.title, render:r => crudRender(sc, r), mount:r => { const q = r.q; if (q.id || q.novo){ history.replaceState(null, '', '#/'+sc.key); S.route.q = {}; } if (q.id && byId(crudColl(sc), q.id)) (sc.detail ? crudDetail(sc, q.id) : crudForm(sc, q.id)); if (q.novo) crudForm(sc); sc.mount && sc.mount(r); }};
}
const crudColl = sc => db[sc.coll];
function crudState(sc){ return S.list[sc.key] ||= {q:'', f:{}, page:1}; }
function crudRows(sc){
  const st = crudState(sc); const q = normalize(st.q);
  return crudColl(sc).filter(r => (!q || normalize(sc.search ? sc.search(r) : r.nome).includes(q)) && (sc.filters||[]).every(f => !st.f[f.n] || String(f.get ? f.get(r) : r[f.n]) === st.f[f.n]));
}
function fieldInput(f, v){
  const val = v ?? f.def ?? '';
  if (f.type==='select') return `<select class="sel" name="${f.n}">${opts(typeof f.opts==='function' ? f.opts() : f.opts, val, f.ph ?? 'Selecione')}</select>`;
  if (f.type==='multi'){ const sel = Array.isArray(val) ? val : []; return `<div class="row wrap" style="gap:6px;padding:4px 0">${(typeof f.opts==='function' ? f.opts() : f.opts).map(o => `<label class="chip ${sel.includes(o.v)?'on':''}" style="cursor:pointer"><input type="checkbox" class="sr" data-multi="${f.n}" value="${esc(o.v)}" ${sel.includes(o.v)?'checked':''} onchange="this.parentElement.classList.toggle('on', this.checked)">${esc(o.l)}</label>`).join('')}</div>`; }
  if (f.type==='bool') return `<label class="swrow" style="height:36px;padding:0 12px"><span class="t">${f.on||'Ativo'}</span><label class="sw"><input type="checkbox" name="${f.n}" ${val?'checked':''}><span></span></label></label>`;
  if (f.type==='textarea') return `<textarea class="inp" name="${f.n}" rows="3" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
  if (f.type==='money') return `<input class="inp" name="${f.n}" type="number" step="0.01" min="0" value="${esc(val)}" placeholder="0,00">`;
  if (f.type==='number') return `<input class="inp" name="${f.n}" type="number" step="${f.step||1}" value="${esc(val)}">`;
  if (f.type==='date') return `<input class="inp" name="${f.n}" type="date" value="${esc(val)}">`;
  if (f.type==='time') return `<input class="inp" name="${f.n}" type="time" value="${esc(val)}">`;
  if (f.type==='color') return `<input class="inp" name="${f.n}" type="color" value="${esc(val||'#F26522')}" style="padding:3px">`;
  return `<input class="inp" name="${f.n}" ${f.type==='email'?'type="email"':''} value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${f.mask?`data-in="mask_${f.mask}"`:''}>`;
}
IN.mask_phone = t => { t.value = maskPhone(t.value); };
IN.mask_doc = t => { t.value = maskDoc(t.value); };
function crudRender(sc){
  const st = crudState(sc); const rows = crudRows(sc); const pages = Math.max(1, Math.ceil(rows.length/PAGE)); st.page = clamp(st.page, 1, pages);
  const vis = rows.slice((st.page-1)*PAGE, st.page*PAGE); const canC = can(sc.perm||sc.key,'criar'), canE = can(sc.perm||sc.key,'editar'), canX = can(sc.perm||sc.key,'excluir');
  return `${pageHead(sc.title, sc.crumbs, `${sc.headActions ? sc.headActions() : ''}<button class="btn" data-a="crudExport" data-k="${sc.key}">${ic('download','sm')} Exportar</button>${canC && !sc.noNew ? `<button class="btn pri" data-a="crudNew" data-k="${sc.key}">${ic('plus','sm')} ${sc.newLabel || 'Novo cadastro'}</button>` : ''}`)}
  ${sc.kpis ? `<div class="kpis">${sc.kpis()}</div>` : ''}
  ${sc.top ? sc.top() : ''}
  <div class="toolbar"><div class="inp-ic search-in">${ic('search','sm')}<input class="inp" placeholder="Buscar ${esc(sc.searchPh || sc.title.toLowerCase())}" value="${esc(st.q)}" data-in="crudQ" data-k="${sc.key}" id="crudQ"></div>
    ${(sc.filters||[]).map(f => `<select class="sel" style="width:auto;min-width:150px" data-ch="crudF" data-k="${sc.key}" data-n="${f.n}">${opts(typeof f.opts==='function'?f.opts():f.opts, st.f[f.n], f.l)}</select>`).join('')}
    <span class="sp"></span><span class="small muted">${plural(rows.length, 'registro')}</span></div>
  <div class="tw"><div class="tw-scroll"><table class="tbl"><thead><tr>${sc.cols.map(c => `<th class="${c.cls||''}">${c.l}</th>`).join('')}<th class="c-act">Ações</th></tr></thead><tbody>
  ${vis.map(r => `<tr class="${sc.detail?'click':''}" ${sc.detail?`data-a="crudOpen" data-k="${sc.key}" data-id="${r.id}"`:''}>${sc.cols.map(c => `<td class="${c.cls||''}">${c.v(r)}</td>`).join('')}<td class="c-act">${sc.rowActions ? sc.rowActions(r) : ''}${canE?`<button class="btn ghost ic-only sm" data-a="crudEdit" data-k="${sc.key}" data-id="${r.id}" title="Editar" aria-label="Editar">${ic('edit','sm')}</button>`:''}${canX && !(sc.noDel && sc.noDel(r))?`<button class="btn ghost ic-only sm" data-a="crudDel" data-k="${sc.key}" data-id="${r.id}" title="Excluir" aria-label="Excluir" style="color:var(--danger)">${ic('trash','sm')}</button>`:''}</td></tr>`).join('') || `<tr><td colspan="${sc.cols.length+1}">${emptyState(sc.icon||'folder', 'Nada encontrado', st.q ? 'Ajuste a busca ou os filtros.' : 'Cadastre o primeiro registro.')}</td></tr>`}
  </tbody></table></div>
  <div class="tfoot"><span>Mostrando ${vis.length ? (st.page-1)*PAGE+1 : 0}–${(st.page-1)*PAGE+vis.length} de ${rows.length}</span><div class="pager"><button data-a="crudPage" data-k="${sc.key}" data-p="${st.page-1}" ${st.page<=1?'disabled':''} aria-label="Anterior">${ic('left','sm')}</button>${Array.from({length:pages}, (_,i) => `<button class="${i+1===st.page?'on':''}" data-a="crudPage" data-k="${sc.key}" data-p="${i+1}">${i+1}</button>`).join('')}<button data-a="crudPage" data-k="${sc.key}" data-p="${st.page+1}" ${st.page>=pages?'disabled':''} aria-label="Próxima">${ic('right','sm')}</button></div></div></div>`;
}
function crudRefreshKeepFocus(){ const q = $('#crudQ'); const pos = q?.selectionStart; refresh(); const n = $('#crudQ'); if (n && q && D.activeElement !== n && pos != null){ n.focus(); n.setSelectionRange(pos, pos); } }
IN.crudQ = t => { const st = crudState(CRUD[t.dataset.k]); st.q = t.value; st.page = 1; crudRefreshKeepFocus(); };
IN.crudF = t => { const st = crudState(CRUD[t.dataset.k]); st.f[t.dataset.n] = t.value; st.page = 1; refresh(); };
A.crudPage = t => { const st = crudState(CRUD[t.dataset.k]); st.page = +t.dataset.p; refresh(); };
A.crudNew = t => crudForm(CRUD[t.dataset.k]);
A.crudEdit = (t, e) => { e?.stopPropagation(); closeAll(); crudForm(CRUD[t.dataset.k], t.dataset.id); };
A.crudOpen = t => crudDetail(CRUD[t.dataset.k], t.dataset.id);
A.crudExport = t => { const sc = CRUD[t.dataset.k]; toast('Exportação gerada', `${sc.title}.xlsx · ${plural(crudRows(sc).length,'linha')}`); };
A.crudDel = async (t, e) => {
  e?.stopPropagation(); const sc = CRUD[t.dataset.k]; const r = byId(crudColl(sc), t.dataset.id); if (!r) return;
  const why = sc.inUse && sc.inUse(r); if (why) return toast('Não é possível excluir', why, 'warn');
  if (!await confirmDlg({title:`Excluir ${sc.singular||'registro'}?`, text:`<b>${esc(sc.label ? sc.label(r) : r.nome)}</b> será removido. Esta ação não pode ser desfeita.`})) return;
  db[sc.coll] = crudColl(sc).filter(x => x.id !== r.id); saveDB(); closeAll(); toast(`${cap(sc.singular||'registro')} excluído`); refresh();
};
function crudForm(sc, id){
  const r = id ? byId(crudColl(sc), id) : {...(typeof sc.defaults==='function' ? sc.defaults() : sc.defaults||{})};
  modal({title: id ? `Editar ${sc.singular||'registro'}` : (sc.newLabel || `Novo ${sc.singular||'registro'}`), sub: id && sc.label ? esc(sc.label(r)) : '', size: sc.fields.length > 6 ? 'lg' : '',
    body:`<form id="crudF" class="fgrid ${sc.fields.length > 8 ? 'c3' : ''}" onsubmit="return false">${sc.fields.map((f,i) => fld(f.l, fieldInput(f, f.read ? f.read(r) : r[f.n]), {req:f.req, hint:f.hint, cls:f.full?'full':''})).join('')}</form>`,
    foot:`<button class="btn" data-a="closeM">Cancelar</button><button class="btn pri" data-a="crudSave" data-k="${sc.key}" data-id="${id||''}">${ic('check','sm')} Salvar</button>`});
  setTimeout(() => $('#crudF [name]')?.focus(), 40);
}
A.crudSave = t => {
  const sc = CRUD[t.dataset.k]; const form = $('#crudF'); const f = formData(form); let ok = true;
  sc.fields.forEach(fd => { const bad = fd.req && (f[fd.n]==='' || f[fd.n]==null); fieldErr(form, fd.n, bad ? 'Campo obrigatório' : ''); if (bad) ok = false; });
  if (sc.validate){ const err = sc.validate(f, t.dataset.id); if (err){ fieldErr(form, err[0], err[1]); ok = false; } }
  if (!ok) return;
  sc.fields.forEach(fd => { if (['money','number'].includes(fd.type)) f[fd.n] = f[fd.n]==='' ? 0 : +f[fd.n]; if (fd.type==='multi') f[fd.n] = $$(`[data-multi="${fd.n}"]:checked`, form).map(i => i.value); if (fd.write) fd.write(f); });
  let r = t.dataset.id ? byId(crudColl(sc), t.dataset.id) : null; const isNew = !r;
  if (isNew){ r = {id:uid(sc.key.slice(0,3)), ...(typeof sc.defaults==='function' ? sc.defaults() : sc.defaults||{})}; crudColl(sc).unshift(r); }
  Object.assign(r, f); sc.onSave && sc.onSave(r, isNew);
  saveDB(); closeAll(); toast(isNew ? `${cap(sc.singular||'registro')} cadastrado` : 'Alterações salvas', esc(sc.label ? sc.label(r) : r.nome || '')); refresh();
};
function crudDetail(sc, id){ const r = byId(crudColl(sc), id); if (!r) return; closeAll(); const d = sc.detail(r); drawer({head:d.head, body:d.body, foot:`${can(sc.perm||sc.key,'editar')?`<button class="btn left" data-a="crudEdit" data-k="${sc.key}" data-id="${r.id}">${ic('edit','sm')} Editar</button>`:''}${d.foot||''}<button class="btn" data-a="closeM">Fechar</button>`}); }

IN.mask_cep = async t => { let v = onlyDigits(t.value).slice(0,8); t.value = v.length > 5 ? v.slice(0,5) + '-' + v.slice(5) : v; if (v.length !== 8 || t.dataset.last === v) return; t.dataset.last = v;

  try { const r = await fetch(`https://viacep.com.br/ws/${v}/json/`); const j = await r.json(); if (j.erro) return toast('CEP não encontrado', 'Confira o número ou preencha o endereço manualmente.', 'warn');
    set('endereco', j.logradouro); set('bairro', j.bairro); set('cidade', j.localidade); set('uf', j.uf); form?.querySelector('[name=numero]')?.focus(); toast('Endereço preenchido pelo CEP', `${j.logradouro} · ${j.bairro}`, 'ok', {ms:2500});
  } catch(e){ toast('Não foi possível consultar o CEP', 'Sem internet? Preencha o endereço manualmente.', 'info'); } };

/* ================= ORÇAMENTOS ================= */
const ST_ORC = {Rascunho:['','Rascunho'], Enviado:['info','Enviado'], Aprovado:['ok','Aprovado'], Recusado:['bad','Recusado']};
const orcSub = o => sum(o.itens, i => i.qtd*i.preco);
const orcTotal = o => orcSub(o) * (1 - (+o.desconto||0)/100);
ROUTES.orcamentos = {title:'Orçamentos', render(r){
  if (r.id && r.sub==='pdf'){ const o = byId(db.orcamentos, r.id); return o ? orcPDF(o) : ''; }
  if (r.id) return orcForm(r.id==='novo' ? null : byId(db.orcamentos, r.id), r.q);
  const st = S.list.orc ||= {st:''}; const list = db.orcamentos.filter(o => !st.st || o.status===st.st).sort((a,b) => b.criadoEm.localeCompare(a.criadoEm));
  const n = s => db.orcamentos.filter(o => o.status===s);
  const decid = n('Aprovado').length + n('Recusado').length;
  return `${pageHead('Orçamentos', [['Orçamentos']], `<a class="btn pri" href="#/orcamentos/novo">${ic('plus','sm')} Orçamento rápido</a>`)}

  <div class="toolbar">${['','Rascunho','Enviado','Aprovado','Recusado'].map(s => `<button class="chip ${st.st===s?'on':''}" data-a="orcF" data-v="${s}">${s||'Todos'} <span class="muted">${s ? n(s).length : db.orcamentos.length}</span></button>`).join('')}</div>
  <div class="tw"><div class="tw-scroll"><table class="tbl"><thead><tr><th>Número</th><th>Cliente</th><th>Itens</th><th>Criado</th><th>Validade</th><th class="num">Total</th><th>Status</th></tr></thead><tbody>${list.map(o => `<tr class="click" data-a="go" data-h="#/orcamentos/${o.id}"><td class="mono b">${o.numero}</td><td>${esc(cliNome(o.clienteId))}</td><td class="small t2">${esc(o.itens.map(i => i.desc).join(', ').slice(0,50))}</td><td class="small">${fdate(o.criadoEm)}</td><td class="small">${fdate(dfrom(o.validade))}</td><td class="num b">${brl(orcTotal(o))}</td><td>${pillOf(o.status, ST_ORC)}</td></tr>`).join('') || `<tr><td colspan="7">${emptyState('calc','Nenhum orçamento','Monte o primeiro em segundos.', `<a class="btn pri" href="#/orcamentos/novo">${ic('plus','sm')} Orçamento rápido</a>`)}</td></tr>`}</tbody></table></div></div>`;
}};
A.orcF = t => { S.list.orc.st = t.dataset.v; refresh(); };
function orcForm(o, q={}){
  if (!S.orcDraft || S.orcDraft._k !== (o?.id || 'novo')){ S.orcDraft = o ? JSON.parse(JSON.stringify(o)) : {clienteId:q.cliente||'', itens:[], desconto:0, validade:dkey(addDays(new Date(),15)), status:'Rascunho', obs:''}; S.orcDraft._k = o?.id || 'novo'; }
  const d = S.orcDraft; const ro = o && ['Aprovado','Recusado'].includes(o.status); const sub = orcSub(d), tot = orcTotal(d);
  const top = db.catalogo.filter(s => s.ativo).slice(0, 8);
  return `${pageHead(o ? o.numero : 'Orçamento rápido', [['Orçamentos','#/orcamentos'],[o ? o.numero : 'Novo']], `${o ? pillOf(o.status, ST_ORC) : ''}${o ? `<a class="btn" href="#/orcamentos/${o.id}/pdf">${ic('fileText','sm')} PDF</a>` : ''}`)}
  <div class="grid g-21"><div class="grid" style="align-content:start">
    <div class="card"><div class="card-b"><div class="fgrid">${fld('Cliente', `<select class="sel" data-ch="ocSet" data-f="clienteId" ${ro?'disabled':''}>${opts(db.clientes.map(c => ({v:c.id,l:c.nome})), d.clienteId, 'Selecione o cliente')}</select>`, {req:true})}${fld('Validade', `<input class="inp" type="date" value="${d.validade}" data-ch="ocSet" data-f="validade" ${ro?'disabled':''}>`)}</div></div></div>
    ${ro ? '' : `<div class="card"><div class="card-h"><h3>${ic('zap')} Toque para adicionar</h3></div><div class="card-b"><div class="row wrap" style="gap:6px">${top.map(s => `<button class="chip" data-a="ocAdd" data-id="${s.id}">${ic('plus','xs')} ${esc(s.nome)} · ${brl(s.preco)}</button>`).join('')}</div><div class="mt12"><select class="sel" data-ch="ocAddSel">${opts(db.catalogo.filter(s=>s.ativo).map(s => ({v:s.id, l:`${s.nome} · ${brl(s.preco)}/${s.un}`})), '', 'Buscar outro item do catálogo')}</select></div></div></div>`}
    <div class="tw"><div class="card-h" style="padding-bottom:12px"><h3>${ic('list')} Itens</h3></div><div class="tw-scroll"><table class="tbl"><thead><tr><th>Item</th><th class="num">Qtd</th><th class="num">Preço</th><th class="num">Total</th>${ro?'':'<th></th>'}</tr></thead><tbody>${d.itens.map((x,i) => `<tr><td class="small">${esc(x.desc)}</td><td class="num">${ro?nf(x.qtd):`<input class="inp sm" type="number" step="0.5" min="0" style="width:72px;text-align:right" value="${x.qtd}" data-ch="ocIt" data-i="${i}" data-f="qtd">`}</td><td class="num">${ro?brl(x.preco):`<input class="inp sm" type="number" step="0.01" style="width:100px;text-align:right" value="${x.preco}" data-ch="ocIt" data-i="${i}" data-f="preco">`}</td><td class="num b">${brl(x.qtd*x.preco)}</td>${ro?'':`<td><button class="btn ghost ic-only sm" data-a="ocDel" data-i="${i}" aria-label="Remover">${ic('trash','sm')}</button></td>`}</tr>`).join('') || `<tr><td colspan="5" class="small muted">Adicione serviços e peças acima.</td></tr>`}</tbody></table></div></div>
    <div class="card"><div class="card-b">${fld('Observações para o cliente', `<textarea class="inp" rows="2" data-ch="ocSet" data-f="obs" ${ro?'disabled':''} placeholder="Ex.: prazo de execução, condições de pagamento">${esc(d.obs||'')}</textarea>`)}</div></div>
  </div>
  <div class="grid" style="align-content:start"><div class="card"><div class="card-h"><h3>${ic('calc')} Resumo</h3></div><div class="card-b">
    <div class="ip-row"><span>Subtotal</span><b>${brl(sub)}</b></div><div class="ip-row"><span>Desconto</span><b>${ro ? pctf(d.desconto,0) : `<input class="inp sm" type="number" min="0" max="50" style="width:70px;text-align:right" value="${d.desconto}" data-ch="ocSet" data-f="desconto"> %`}</b></div>
    <div class="ip-row" style="font-size:17px;margin-top:6px"><span style="color:var(--text)">Total</span><b style="color:var(--accent-ink)">${brl(tot)}</b></div>
    <div class="grid mt16" style="gap:8px">${ro ? `<div class="small muted">${o.status==='Aprovado' ? `Aprovado.${o.osId ? ` <a href="#/os/${o.osId}">Ver OS</a>` : ''}` : 'Orçamento recusado.'}</div>` : `<button class="btn" data-a="ocSave">${ic('check','sm')} Salvar</button><button class="btn pri" data-a="ocEnviar">${ic('msg','sm')} Gerar PDF e enviar no WhatsApp</button>${o && o.status!=='Rascunho' ? `<button class="btn ok" data-a="ocAprovar">${ic('checkC','sm')} Cliente aprovou · criar OS</button><button class="btn dan" data-a="ocRecusar">Cliente recusou</button>` : ''}`}</div></div></div>
    <div class="card pad small t2">${ic('info','sm')} No celular, o PDF abre para salvar ou compartilhar. O texto do WhatsApp já vai com os itens e o total.</div></div></div>`;
}
const ocRe = () => { const y = scrollY; $('#view').innerHTML = orcForm(byId(db.orcamentos, S.route.id), S.route.q); scrollTo(0,y); };
IN.ocSet = t => { S.orcDraft[t.dataset.f] = t.dataset.f==='desconto' ? +t.value : t.value; if (t.dataset.f==='desconto') ocRe(); };
IN.ocIt = t => { S.orcDraft.itens[+t.dataset.i][t.dataset.f] = +t.value || 0; ocRe(); };
const ocAddItem = id => { const s = byId(db.catalogo, id); const ex = S.orcDraft.itens.find(i => i.servicoId===id); if (ex) ex.qtd += 1; else S.orcDraft.itens.push({servicoId:s.id, desc:s.nome, qtd:1, preco:s.preco}); ocRe(); };
A.ocAdd = t => ocAddItem(t.dataset.id);
IN.ocAddSel = t => { if (t.value) ocAddItem(t.value); };
A.ocDel = t => { S.orcDraft.itens.splice(+t.dataset.i, 1); ocRe(); };
function ocPersist(status){
  const d = S.orcDraft; if (!d.clienteId){ toast('Escolha o cliente', '', 'warn'); return null; } if (!d.itens.length){ toast('Adicione ao menos um item', '', 'warn'); return null; }
  let o = byId(db.orcamentos, d.id); const isNew = !o;
  if (isNew){ const n = Math.max(300, ...db.orcamentos.map(x => +x.numero.split('-')[1])) + 1; o = {id:uid('or'), numero:`ORC-${n}`, criadoEm:new Date().toISOString()}; db.orcamentos.unshift(o); }
  const clean = JSON.parse(JSON.stringify(d)); delete clean._k; Object.assign(o, clean, {id:o.id, numero:o.numero, criadoEm:o.criadoEm}); if (status) o.status = status;
  S.orcDraft = null; saveDB(); return o;
}
A.ocSave = () => { const o = ocPersist(); if (!o) return; toast('Orçamento salvo', o.numero); location.hash = `#/orcamentos/${o.id}`; refresh(); };
A.ocEnviar = () => { const o = ocPersist('Enviado'); if (!o) return; o.enviadoEm = new Date().toISOString(); saveDB();
  window.open(waTexto(orcTxt(o)), '_blank', 'noopener'); toast('Orçamento enviado', 'Agora gere o PDF para anexar na conversa.'); location.hash = `#/orcamentos/${o.id}/pdf`; };
A.ocRecusar = async () => { const o = byId(db.orcamentos, S.route.id); if (!await confirmDlg({title:'Cliente recusou o orçamento?', ok:'Marcar recusado'})) return; o.status = 'Recusado'; S.orcDraft = null; saveDB(); toast('Orçamento recusado', '', 'info'); refresh(); };
A.ocAprovar = () => { const o = byId(db.orcamentos, S.route.id); const temInst = o.itens.some(i => /instala/i.test(i.desc)); const temHig = o.itens.every(i => /higieniza/i.test(i.desc));
  modal({title:'Criar a OS do orçamento aprovado', sub:`${o.numero} · ${esc(cliNome(o.clienteId))} · ${brl(orcTotal(o))}`, body:`<form id="oaF" class="fgrid" onsubmit="return false">${fld('Tipo de atendimento', `<select class="sel" name="tipo">${opts(Object.keys(TIPO), temInst ? 'Instalação' : temHig ? 'Preventiva' : 'Corretiva')}</select>`)}${fld('Técnico', `<select class="sel" name="tecnicoId">${opts(db.tecnicos.filter(t=>t.ativo).map(t => ({v:t.id,l:t.nome})), db.tecnicos[0]?.id, 'Definir depois')}</select>`)}${fld('Data', `<input class="inp" type="date" name="data" value="${dkey(addDays(new Date(),1))}">`)}${fld('Horário', `<input class="inp" type="time" name="hora" value="09:00">`)}</form>`, foot:`<button class="btn" data-a="closeM">Cancelar</button><button class="btn pri" data-a="ocAprovOk">${ic('check','sm')} Criar OS</button>`}); };
A.ocAprovOk = () => { const o = byId(db.orcamentos, S.route.id); const f = formData($('#oaF')); const n = Math.max(140, ...db.os.map(x => +x.numero.split('-')[1])) + 1;
  const os = {id:uid('os'), numero:`OS-${n}`, clienteId:o.clienteId, equipamentoIds:[], tipo:f.tipo, status: f.tecnicoId && f.data ? 'Agendada' : 'Pendente', tecnicoId:f.tecnicoId, data:f.data, hora:f.hora, problema:`Execução do ${o.numero}`, itens:JSON.parse(JSON.stringify(o.itens)).map(i => ({...i, preco: i.preco*(1-(+o.desconto||0)/100)})), checklist:{}, medicoes:{}, fotos:{antes:[], depois:[]}, assinatura:null, criadaEm:new Date().toISOString()};
  db.os.unshift(os); o.status = 'Aprovado'; o.osId = os.id; S.orcDraft = null; saveDB(); closeAll(); toast('OS criada a partir do orçamento', `${os.numero} · ${os.status}`); location.hash = `#/os/${os.id}`; };
function orcTxt(o){ const c = byId(db.clientes, o.clienteId); return `*Orçamento ${o.numero} · ${brandName()}*\nCliente: ${c?.nome}\n\n${o.itens.map(i => `• ${i.desc} (${nf(i.qtd)}): ${brl(i.qtd*i.preco)}`).join('\n')}${+o.desconto ? `\nDesconto: ${pctf(o.desconto,0)}` : ''}\n*Total: ${brl(orcTotal(o))}*\nVálido até ${fdate(dfrom(o.validade))}.\n\nPara aprovar, é só responder esta mensagem.`; }
function orcPDF(o){
  const c = byId(db.clientes, o.clienteId) || {};
  return `<div class="no-print">${pageHead(`PDF · ${o.numero}`, [['Orçamentos','#/orcamentos'],[o.numero,`#/orcamentos/${o.id}`],['PDF']], `<a class="btn" href="#/orcamentos/${o.id}">${ic('back','sm')} Voltar</a><a class="btn" target="_blank" rel="noopener" href="${waTexto(orcTxt(o))}">${ic('msg','sm')} WhatsApp</a><button class="btn pri" data-a="print">${ic('printer','sm')} Imprimir / salvar PDF</button>`)}</div>
  <div class="rdo-doc"><div class="row" style="justify-content:space-between;align-items:flex-start;border-bottom:2px solid #0284C7;padding-bottom:12px"><div class="row" style="gap:10px">${BRAND_IC}<div><h2>${esc(brandName())}</h2><div style="font-size:11px;color:#555">CNPJ ${esc(db.empresa.cnpj)} · ${esc(db.empresa.telefone)} · ${esc(db.empresa.email)}<br>${esc(db.empresa.endereco)}</div></div></div><div style="text-align:right"><b style="font-size:16px">ORÇAMENTO</b><div>${o.numero}</div><div>${fdate(o.criadoEm)}</div></div></div>
  <table><tr><th style="width:18%">Cliente</th><td>${esc(c.nome||'')}</td><th style="width:14%">CPF/CNPJ</th><td>${esc(c.doc||'')}</td></tr><tr><th>Endereço</th><td colspan="3">${esc(enderecoDe(c))}</td></tr><tr><th>Contato</th><td>${esc(c.telefone||'')}</td><th>E-mail</th><td>${esc(c.email||'')}</td></tr></table>
  <table><tr><th>Serviço / peça</th><th style="width:70px">Qtd</th><th style="width:110px">Preço</th><th style="width:110px">Total</th></tr>${o.itens.map(i => `<tr><td>${esc(i.desc)}</td><td>${nf(i.qtd)}</td><td>${brl(i.preco)}</td><td>${brl(i.qtd*i.preco)}</td></tr>`).join('')}<tr><td colspan="3">Subtotal</td><td>${brl(orcSub(o))}</td></tr>${+o.desconto?`<tr><td colspan="3">Desconto (${pctf(o.desconto,0)})</td><td>− ${brl(orcSub(o)-orcTotal(o))}</td></tr>`:''}<tr><th colspan="3">TOTAL</th><th>${brl(orcTotal(o))}</th></tr></table>
  ${o.obs?`<table><tr><th>Observações</th></tr><tr><td>${esc(o.obs)}</td></tr></table>`:''}
  <p style="font-size:11px;margin-top:12px">Validade: ${fdate(dfrom(o.validade))} · Formas de pagamento: Pix, cartão, boleto ou faturado em 30 dias (empresas) · Garantia do serviço: 90 dias.</p>
  <div class="sig" style="grid-template-columns:1fr 1fr"><div>${esc(brandName())}</div><div>De acordo · ${esc(c.nome||'Cliente')}</div></div></div>`;
}

/* ================= FINANCEIRO ================= */
ROUTES.financeiro = {title:'Financeiro', render(){
  const st = S.list.fin ||= {st:'', forma:''}; const tt = titulos();
  const list = tt.filter(t => (!st.st || t.situacao===st.st) && (!st.forma || t.forma===st.forma)).sort((a,b) => (a.situacao==='Pago') - (b.situacao==='Pago') || a.venc.localeCompare(b.venc));
  const ab = tt.filter(t => t.situacao==='Em aberto'), vc = tt.filter(t => t.situacao==='Vencido'), pg = tt.filter(t => t.situacao==='Pago'); const mes = new Date().getMonth();
  const prox = ab.filter(t => t.dias <= 3);
  return `${pageHead('Financeiro', [['Financeiro']], `${statPill('alert','var(--danger)','Vencidos', vc.length)}`)}
  ${vc.length || prox.length ? `<div class="card pad mb16" style="border-color:var(--${vc.length?'danger':'warn'});background:var(--${vc.length?'danger':'warn'}-bg);color:var(--${vc.length?'danger':'warn'})">${ic('bell','sm')} <b>${vc.length ? `${vc.length} recebimento(s) vencido(s): ${brl(sum(vc,t=>t.valor))}.` : ''}</b> ${prox.length ? `${prox.length} vence(m) nos próximos 3 dias.` : ''}</div>` : ''}
  <div class="kpis"><div class="kpi"><div class="kpi-l">Recebido no mês<i>${ic('trendUp')}</i></div><div class="kpi-v up">${brlk(sum(pg.filter(t => t.pagoEm && new Date(t.pagoEm).getMonth()===mes), t=>t.valor))}</div><div class="kpi-s">${pg.length} pagamentos registrados</div>${miniSVG([5,7,6,9,8,10,9,12],'area','var(--success)')}</div><div class="kpi"><div class="kpi-l">Em aberto<i>${ic('clock')}</i></div><div class="kpi-v">${brlk(sum(ab,t=>t.valor))}</div><div class="kpi-s">${ab.length} título(s) a vencer</div></div><div class="kpi"><div class="kpi-l">Vencidos<i>${ic('alert')}</i></div><div class="kpi-v ${vc.length?'dn':''}">${brlk(sum(vc,t=>t.valor))}</div><div class="kpi-s">${vc.length} título(s)</div></div><div class="kpi"><div class="kpi-l">Faturado 30 dias<i>${ic('calendar')}</i></div><div class="kpi-v">${brlk(sum(tt.filter(t => t.forma==='Faturado 30 dias' && t.situacao!=='Pago'), t=>t.valor))}</div><div class="kpi-s">empresas com prazo</div></div></div>
  <div class="toolbar"><div class="row wrap" style="gap:6px">${['','Em aberto','Vencido','Pago'].map(s => `<button class="chip ${st.st===s?'on':''}" data-a="finF" data-v="${s}">${s||'Todos'} <span class="muted">${s ? tt.filter(t=>t.situacao===s).length : tt.length}</span></button>`).join('')}</div><select class="sel" style="width:auto" data-ch="finForma">${opts(FORMAS, st.forma, 'Todas as formas')}</select></div>
  <div class="grid g-21"><div class="tw"><div class="tw-scroll"><table class="tbl"><thead><tr><th>OS</th><th>Cliente</th><th>Forma</th><th>Vencimento</th><th class="num">Valor</th><th>Situação</th><th class="c-act"></th></tr></thead><tbody>${list.map(t => `<tr><td class="mono b"><a href="#/os/${t.id}">${t.numero}</a></td><td>${esc(cliNome(t.clienteId))}</td><td class="small">${esc(t.forma)}</td><td class="small">${fdate(dfrom(t.venc))}${t.situacao!=='Pago' ? `<div class="xsmall" style="color:var(--${t.situacao==='Vencido'?'danger':t.dias<=3?'warn':'muted'});font-weight:600">${t.situacao==='Vencido' ? `vencido há ${-t.dias} dia(s)` : t.dias===0 ? 'vence hoje' : `em ${t.dias} dia(s)`}</div>` : ''}</td><td class="num b">${brl(t.valor)}</td><td>${pillOf(t.situacao, {Pago:['ok','Pago'],'Em aberto':['info','Em aberto'],Vencido:['bad','Vencido']})}</td><td class="c-act">${t.situacao!=='Pago' ? `<a class="btn xs" target="_blank" rel="noopener" href="${waTexto(cobrancaTxt(t))}" title="Lembrar o cliente no WhatsApp">${ic('msg','xs')}</a> <button class="btn xs ok" data-a="finPagar" data-id="${t.id}">Recebido</button>` : `<span class="xsmall muted">${fdate(t.pagoEm)}</span>`}</td></tr>`).join('') || `<tr><td colspan="7">${emptyState('wallet','Nada por aqui','Os recebimentos aparecem quando a OS é finalizada.')}</td></tr>`}</tbody></table></div></div>
  <div class="card"><div class="card-h"><h3>${ic('pie')} Recebido por forma</h3></div><div class="card-b" style="text-align:center">${(() => { const cores = ['var(--accent)','var(--teal)','#16A34A','#F59E0B','#7C3AED','#DC2626']; const it = FORMAS.map((f,i) => ({l:f, v:sum(pg.filter(t => t.forma===f), t=>t.valor), c:cores[i], f:brl})).filter(x => x.v); return donutSVG(it, {size:160, thick:20, center:brlk(sum(it,x=>x.v)), centerSub:'recebido'}) + `<div class="mt12" style="text-align:left">${it.map(x => `<div class="ip-row"><span class="row" style="gap:6px"><span class="dotc" style="--c:${x.c}"></span>${x.l}</span><b>${brl(x.v)}</b></div>`).join('')}</div>`; })()}</div></div></div>`;
}};
A.finF = t => { S.list.fin.st = t.dataset.v; refresh(); };
IN.finForma = t => { S.list.fin.forma = t.value; refresh(); };
const cobrancaTxt = t => `Olá, ${cliNome(t.clienteId).split(' ')[0]}! Aqui é da ${brandName()}. Passando para lembrar do pagamento da ${t.numero} (${brl(t.valor)}), ${t.situacao==='Vencido' ? `vencido em ${fdate(dfrom(t.venc))}` : `com vencimento em ${fdate(dfrom(t.venc))}`}. Chave Pix: ${db.empresa.pix}. Obrigado!`;
A.finPagar = t => { const o = byId(db.os, t.dataset.id); modal({title:'Registrar recebimento', sub:`${o.numero} · ${esc(cliNome(o.clienteId))} · ${brl(o.pagamento.valor)}`, size:'sm', body:`<form id="fpF" class="fgrid" onsubmit="return false">${fld('Recebido via', `<select class="sel" name="forma">${opts(FORMAS, o.pagamento.forma)}</select>`, {cls:'full'})}${fld('Data', `<input class="inp" type="date" name="data" value="${dkey(new Date())}">`, {cls:'full'})}</form>`, foot:`<button class="btn" data-a="closeM">Cancelar</button><button class="btn ok" data-a="finPagarOk" data-id="${o.id}">${ic('check','sm')} Confirmar</button>`}); };
A.finPagarOk = t => { const o = byId(db.os, t.dataset.id); const f = formData($('#fpF')); o.pagamento.status = 'Pago'; o.pagamento.forma = f.forma; o.pagamento.pagoEm = dfrom(f.data || dkey(new Date())).toISOString(); saveDB(); closeAll(); toast('Recebimento registrado', `${o.numero} · ${brl(o.pagamento.valor)}`); refresh(); };

/* ================= CONFIGURAÇÕES ================= */
ROUTES.config = {title:'Configurações', render(){
  const e = db.empresa;
  return `${pageHead('Configurações', [['Configurações']])}
  <div class="grid g-21"><div class="card"><div class="card-h"><h3>${ic('building')} Dados da empresa</h3></div><div class="card-b"><form id="cfF" class="fgrid" onsubmit="return false">${fld('Nome da empresa', `<input class="inp" name="nome" value="${esc(e.nome)}">`, {cls:'full', hint:'Aparece no menu, nos PDFs e nas mensagens de WhatsApp.'})}${fld('CNPJ', `<input class="inp" name="cnpj" value="${esc(e.cnpj)}" data-in="mask_doc">`)}${fld('Responsável', `<input class="inp" name="responsavel" value="${esc(e.responsavel)}">`)}${fld('Telefone', `<input class="inp" name="telefone" value="${esc(e.telefone)}">`)}${fld('WhatsApp', `<input class="inp" name="whatsapp" value="${esc(e.whatsapp)}">`)}${fld('E-mail', `<input class="inp" name="email" value="${esc(e.email)}">`)}${fld('Chave Pix', `<input class="inp" name="pix" value="${esc(e.pix)}">`)}${fld('Endereço', `<input class="inp" name="endereco" value="${esc(e.endereco)}">`, {cls:'full'})}</form></div><div class="m-f"><button class="btn pri" data-a="cfSave">${ic('check','sm')} Salvar</button></div></div>
  <div class="grid" style="align-content:start"><div class="card"><div class="card-h"><h3>${ic('refresh')} Dados do protótipo</h3></div><div class="card-b"><p class="small t2" style="margin:0 0 12px">Tudo fica salvo neste navegador. Cada pessoa testa de forma independente.</p><div class="grid" style="gap:8px"><button class="btn" data-a="resetDemo">${ic('refresh','sm')} Recomeçar com dados de exemplo</button><button class="btn dan" data-a="resetZero">${ic('trash','sm')} Começar do zero</button></div></div></div>
  <div class="card pad small t2">${ic('info','sm')} Protótipo navegável: WhatsApp abre a conversa com o texto pronto, o PDF sai pela impressão do navegador e as fotos usam a câmera do celular. Nada é enviado automaticamente.</div></div></div>`;
}};
A.cfSave = () => { Object.assign(db.empresa, formData($('#cfF'))); saveDB(); toast('Dados da empresa salvos', esc(db.empresa.nome)); render(); };

/* ================= BOOT ================= */
function boot(){
  loadDB();
  if (lsGet(LS_SBC)) D.body.classList.add('sbc');
  render();
  if (S.firstRun) setTimeout(() => toast(`Bem-vindo à ${brandName()}`, 'Dados de exemplo carregados. Troque o nome da empresa em Configurações.', 'info', {ms:6000}), 500);
}
boot();
</script>
</body>
</html>
